
stages:
  - build
  - push
  - test
  - deploy_dev
  - deploy_qa
  - deploy_staging
  - deploy_prod

# 🔨 Build
build:
  stage: build
  image: docker:29.3.0-cli
  services:
  - docker:29.3-dind
  before_script:
  - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD
  script:
  - docker build -t $DOCKERHUB_USERNAME/$DOCKERHUB_PROJECT:$TAG .

# 📦 Push image
push:
  stage: push
  script:
    - docker push $DOCKERHUB_USERNAME/$DOCKERHUB_PROJECT:$TAG
  after_script:
    - docker images
  needs:
    - build

# 🧪 Test
test:
  stage: test
  script:
    - echo "Run tests here"

# 🚀 Deploy DEV
deploy_dev:
  stage: deploy_dev
  script:
    - kubectl config set-cluster kubernetes --server=$KUBE_URL
    - echo $KUBE_CONFIG | base64 -d > kubeconfig
    - export KUBECONFIG=kubeconfig
    - kubectl apply -f k8s/dev/
  environment:
    name: dev
  only:
    - develop

# 🚀 Deploy QA
deploy_qa:
  stage: deploy_qa
  script:
    - kubectl apply -f k8s/qa/
  environment:
    name: qa
  only:
    - qa

# 🚀 Deploy STAGING
deploy_staging:
  stage: deploy_staging
  script:
    - kubectl apply -f k8s/staging/
  environment:
    name: staging
  only:
    - staging

# 🚀 Deploy PROD (manual)
deploy_prod:
  stage: deploy_prod
  script:
    - kubectl apply -f k8s/prod/
  environment:
    name: production
  only:
    - main
  when: manual