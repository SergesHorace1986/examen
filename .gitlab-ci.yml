image: node:alpine

variables:
  IMAGE: $DOCKERHUB_USERNAME/skyblue-app

stages:
  - build
  - test
  - deploy_dev
  - deploy_qa
  - deploy_staging
  - deploy_prod

# install dependencies 
install:
  stage: build
  script:
    - echo "Install run.."
    - npm install
  after_script:
    - ls -la

# build the application   
build:
  stage: build
  script:
    - echo "build run..."
    - npm run ci
  after_script:
    - ls -la
  needs:
    - install

# 🔨 Build image
build-docker-image:
  stage: build
  image: docker:29.3.0-cli
  services:
    - docker:29.3-dind
  before_script:
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD
  script:
   - echo "push docker image..."
   - docker build -t $IMAGE:$CI_COMMIT_SHORT_SHA .
   - docker push $IMAGE:$CI_COMMIT_SHORT_SHA
  after_script:
    - docker images
  needs:
    - build

# 🧪 Test
test:
  stage: test
  script:
    - echo "Run tests here"

# 🚀 Deploy DEV
deploy_dev:
  stage: deploy_dev
  image: bitnami/kubectl:latest
  script:
    - kubectl apply -f k8s/dev/
  only:
    - dev

#🚀 Deploy QA
deploy_qa:
  stage: deploy_qa
  image: bitnami/kubectl:latest
  script:
    - kubectl apply -f k8s/qa/
  only:
    - qa

# 🚀 Deploy STAGING
deploy_staging:
  stage: deploy_staging
  image: bitnami/kubectl:latest
  script:
    - kubectl apply -f k8s/staging/
  only:
    - staging

# 🚨 Deploy PROD (manual)
deploy_prod:
  stage: deploy_prod
  image: bitnami/kubectl:latest
  script:
    - kubectl apply -f k8s/prod/
  only:
    - main
  when: manual