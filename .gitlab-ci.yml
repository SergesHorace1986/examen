image: docker:29.3.0-cli

services:
  - docker:29.3-dind

variables:
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_TLS_CERTDIR: ""
  TAG: latest

stages:
  - build
  - test
  - deploy_dev
  - deploy_qa
  - deploy_staging
  - deploy_prod

# 🔨 Build
build and push:
  stage: build
  script:
  # Login to Docker Hub
  - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD

  # Build image
  - docker build -t $DOCKERHUB_USERNAME/examen:$TAG .
  
  # Verify image exists (debug)
  - docker images

  # 📦 Push image to Docker Hub
  - docker push $DOCKERHUB_USERNAME/examen:$TAG

# 🧪 Test
test:
  stage: test
  script:
    - echo "Run tests here"

deploy_dev:
  stage: deploy_dev
  script:
    - kubectl apply -f k8s/dev/
  only:
    - dev

deploy_qa:
  stage: deploy_qa
  script:
    - kubectl apply -f k8s/qa/
  only:
    - qa

deploy_staging:
  stage: deploy_staging
  script:
    - kubectl apply -f k8s/staging/
  only:
    - staging

deploy_prod:
  stage: deploy_prod
  script:
    - kubectl apply -f k8s/prod/
  only:
    - main
  when: manual