image: node:alpine

variables:
  IMAGE: $DOCKERHUB_USERNAME/skyblue-app

stages:
  - build
  - test
  - deploy

# install dependencies 
install:
  stage: build
  script:
    - echo "Install run.."
    - npm install
  after_script:
    - ls -la

# build the application   
build:
  stage: build
  script:
    - echo "build run..."
    - npm install
  after_script:
    - ls -la
  needs:
    - install

# 🔨 Build image
build-docker-image:
  stage: build
  image: docker:29.3.0-cli
  services:
    - docker:29.3-dind
  before_script:
    - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD
  script:
   - echo "push docker image..."
   - docker build -t $IMAGE:$CI_COMMIT_SHORT_SHA .
   - docker push $IMAGE:$CI_COMMIT_SHORT_SHA
  after_script:
    - docker images
  needs:
    - build

# 🧪 Test
test:
  stage: test
  script:
    - echo "Run tests here"

# 🚀 Deploy DEV
deploy_dev:
  stage: deploy
  image:
    name: alpine/helm:latest
    entrypoint: [""]
  script:
    - mkdir -p ~/.kube
    - echo "$KUBE_CONFIG" > ~/.kube/config
    - helm upgrade --install examen ./examen-chart -f examen-chart/values-dev.yaml -n dev
  only:
    - develop

#🚀 Deploy QA
deploy_qa:
  stage: deploy
  image:
    name: alpine/helm:latest
    entrypoint: [""]
  script:
    - mkdir -p ~/.kube
    - echo "$KUBE_CONFIG" > ~/.kube/config
    - helm upgrade --install examen ./examen-chart -f examen-chart/values-qa.yaml -n qa
  only:
    - qa

# 🚀 Deploy STAGING
deploy_staging:
  stage: deploy
  image:
    name: alpine/helm:latest
    entrypoint: [""]
  script:
    - mkdir -p ~/.kube
    - echo "$KUBE_CONFIG" > ~/.kube/config
    - helm upgrade --install examen ./examen-chart -f examen-chart/values-staging.yaml -n staging
  only:
    - staging

# 🚨 Deploy PROD (manual)
deploy_prod:
  stage: deploy
  image:
    name: alpine/helm:latest
    entrypoint: [""]
  script:
    - mkdir -p ~/.kube
    - echo "$KUBE_CONFIG" > ~/.kube/config
    - helm upgrade --install examen ./examen-chart -f examen-chart/values-prod.yaml -n prod
  only:
    - main
  when: manual