image: docker:29.3.0-cli

services:
  - docker:29.3-dind

variables:
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_TLS_CERTDIR: ""
  TAG: latest

stages:
  - build
  - test
  - deploy_dev
  - deploy_qa
  - deploy_staging
  - deploy_prod

# 🔨 Build
build and push:
  stage: build
  script:
  # Login to Docker Hub
  - docker login -u $DOCKERHUB_USERNAME -p $DOCKERHUB_PASSWORD

  # Build image
  - docker build -t $DOCKERHUB_USERNAME/examen:$TAG .
  
  # Verify image exists (debug)
  - docker images

  # 📦 Push image to Docker Hub
  - docker push $DOCKERHUB_USERNAME/examen:$TAG

# 🧪 Test
test:
  stage: test
  script:
    - echo "Run tests here"

.deploy_template:
  image: bitnami/kubectl:latest
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
  script:
    - kubectl set image deployment/my-app my-app=$DOCKERHUB_USERNAME/examen:$TAG -n $KUBE_NAMESPACE || true
    - kubectl apply -f k8s/$ENV/
    - kubectl rollout status deployment/my-app -n $KUBE_NAMESPACE


# 🚀 Deploy DEV
deploy_dev:
  stage: deploy_dev
  extends: .deploy_template
  variables:
    ENV: dev
    KUBE_NAMESPACE: dev
  environment:
    name: dev

# 🚀 Deploy QA
deploy_qa:
  stage: deploy_qa
  extends: .deploy_template
  variables:
    ENV: qa
    KUBE_NAMESPACE: qa
  environment:
    name: qa

# 🚀 Deploy STAGING
deploy_staging:
  stage: deploy_staging
  extends: .deploy_template
  variables:
    ENV: staging
    KUBE_NAMESPACE: staging
  environment:
    name: staging
  when: manual

# 🚀 Deploy PROD (manual)
deploy_prod:
  stage: deploy_prod
  extends: .deploy_template
  variables:
    ENV: prod
    KUBE_NAMESPACE: prod
  environment:
    name: production
  when: manual